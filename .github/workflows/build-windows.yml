name: Build Windows Application (Pure Rust)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "desktop_app/package-lock.json"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop_app/src-tauri -> target"

      - name: Install Frontend Dependencies
        working-directory: desktop_app
        run: npm install

      - name: Build Pure Rust Tauri Windows App
        working-directory: desktop_app
        run: npx tauri build

      - name: Gather Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_artifacts"
          
          # 1. 收集 NSIS Windows 安装程序
          Get-ChildItem -Path "desktop_app/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist_artifacts/"
            Write-Host "Found NSIS Setup: $($_.Name)" -ForegroundColor Green
          }

          # 2. 收集纯原生绿色便携免安装版 (仅单个轻量 exe，无任何 Python 运行时依赖)
          if (Test-Path "desktop_app/src-tauri/target/release/desktop_app.exe") {
            New-Item -ItemType Directory -Force -Path "dist_artifacts/hospital_voucher_pure_rust_portable"
            Copy-Item "desktop_app/src-tauri/target/release/desktop_app.exe" -Destination "dist_artifacts/hospital_voucher_pure_rust_portable/石家庄心理医院财务进销存工作台.exe"
            if (Test-Path "factory_mapping.json") {
              Copy-Item "factory_mapping.json" -Destination "dist_artifacts/hospital_voucher_pure_rust_portable/"
            }
            Compress-Archive -Path "dist_artifacts/hospital_voucher_pure_rust_portable/*" -DestinationPath "dist_artifacts/医院财务凭证工作台_纯原生绿色便携版_x64.zip" -Force
            Write-Host "Created Portable Pure Rust Zip package!" -ForegroundColor Green
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pure-rust-app
          path: dist_artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_artifacts/*.exe
            dist_artifacts/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
