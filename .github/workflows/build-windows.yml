name: Build Windows Application

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl xlrd xlwt xlutils

      - name: Build standalone Python runner (runner.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop_app/src-tauri/resources"
          pyinstaller --onefile --noconsole --name runner `
            --distpath "desktop_app/src-tauri/resources" `
            --paths "." `
            --paths "desktop_app/backend" `
            --hidden-import xlrd `
            --hidden-import xlwt `
            --hidden-import xlutils `
            --hidden-import xlutils.copy `
            --hidden-import openpyxl `
            --hidden-import pandas `
            --hidden-import process_sales `
            --hidden-import generate_voucher `
            --hidden-import generate_inbound_voucher `
            --hidden-import compare_inventory `
            --add-data "process_sales.py;." `
            --add-data "generate_voucher.py;." `
            --add-data "generate_inbound_voucher.py;." `
            --add-data "compare_inventory.py;." `
            --add-data "factory_mapping.json;." `
            desktop_app/backend/runner.py

          if (Test-Path "desktop_app/src-tauri/resources/runner.exe") {
            Write-Host ">>> runner.exe successfully built!" -ForegroundColor Green
            Copy-Item "desktop_app/src-tauri/resources/runner.exe" -Destination "desktop_app/backend/runner.exe" -Force
            # 运行冒烟自测
            & "desktop_app/src-tauri/resources/runner.exe" scan
          } else {
            Write-Error "runner.exe failed to build!"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "desktop_app/package-lock.json"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop_app/src-tauri -> target"

      - name: Install Frontend Dependencies
        working-directory: desktop_app
        run: npm install

      - name: Build Tauri Windows App
        working-directory: desktop_app
        run: npx tauri build

      - name: Gather Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_artifacts"
          
          # 1. 收集 NSIS Windows 安装程序
          Get-ChildItem -Path "desktop_app/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist_artifacts/"
            Write-Host "Found NSIS Setup: $($_.Name)" -ForegroundColor Green
          }

          # 2. 打包绿色便携免安装版 (包含主程序与内置 Python Sidecar runner.exe)
          if (Test-Path "desktop_app/src-tauri/target/release/desktop_app.exe") {
            New-Item -ItemType Directory -Force -Path "dist_artifacts/portable"
            Copy-Item "desktop_app/src-tauri/target/release/desktop_app.exe" -Destination "dist_artifacts/portable/医院财务凭证自动化系统.exe"
            New-Item -ItemType Directory -Force -Path "dist_artifacts/portable/resources"
            if (Test-Path "desktop_app/src-tauri/resources/runner.exe") {
              Copy-Item "desktop_app/src-tauri/resources/runner.exe" -Destination "dist_artifacts/portable/resources/runner.exe"
            }
            Compress-Archive -Path "dist_artifacts/portable/*" -DestinationPath "dist_artifacts/医院财务凭证自动化系统_免安装绿色版.zip" -Force
            Remove-Item -Recurse -Force "dist_artifacts/portable"
            Write-Host "Created Portable ZIP bundle!" -ForegroundColor Green
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-Voucher-Studio-Windows-x64
          path: dist_artifacts/*
          retention-days: 30
