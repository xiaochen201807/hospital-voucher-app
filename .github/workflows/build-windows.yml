name: Build Windows Application

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl xlrd

      - name: Build standalone Python runner (runner.exe)
        shell: pwsh
        run: |
          # 确保 resources 目录存在
          New-Item -ItemType Directory -Force -Path "desktop_app/src-tauri/resources"
          
          # 使用 PyInstaller 编译无 Python 环境依赖的纯独立二进制 runner.exe
          pyinstaller --onefile --noconsole --name runner `
            --distpath "desktop_app/src-tauri/resources" `
            --add-data "process_sales.py;." `
            --add-data "generate_voucher.py;." `
            --add-data "generate_inbound_voucher.py;." `
            --add-data "factory_mapping.json;." `
            desktop_app/backend/runner.py

          # 验证 runner.exe 是否生成成功
          if (Test-Path "desktop_app/src-tauri/resources/runner.exe") {
            Write-Host ">>> runner.exe successfully built!" -ForegroundColor Green
            Copy-Item "desktop_app/src-tauri/resources/runner.exe" -Destination "desktop_app/backend/runner.exe" -Force
          } else {
            Write-Error "runner.exe failed to build!"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "desktop_app/package-lock.json"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: desktop_app
        run: npm install

      - name: Build Tauri Windows App
        working-directory: desktop_app
        run: npx tauri build

      - name: Gather Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_artifacts"
          
          # 复制 MSI 安装包
          Get-ChildItem -Path "desktop_app/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist_artifacts/"
            Write-Host "Found MSI: $($_.Name)"
          }
          
          # 复制 NSIS exe 安装包
          Get-ChildItem -Path "desktop_app/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist_artifacts/"
            Write-Host "Found NSIS Setup: $($_.Name)"
          }
          
          # 复制主可执行文件
          if (Test-Path "desktop_app/src-tauri/target/release/desktop_app.exe") {
            Copy-Item "desktop_app/src-tauri/target/release/desktop_app.exe" -Destination "dist_artifacts/医院财务凭证自动化工作台.exe"
            Write-Host "Found Portable EXE"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-Voucher-Studio-Windows-x64
          path: dist_artifacts/*
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
